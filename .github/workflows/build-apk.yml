name: Build Yalla Habibi Premium APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract premium Android project
        run: |
          set -e
          mkdir -p extracted_project
          unzip -q Yalla_Habibi_Premium_Featured_Project.zip -d extracted_project

          echo "Checking project structure..."
          find extracted_project -maxdepth 5 \
            \( -name build.gradle -o -name build.gradle.kts \
            -o -name settings.gradle -o -name settings.gradle.kts \) \
            -type f

      - name: Build APK
        working-directory: extracted_project/yalla_habibi_android
        run: |
          set -e
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yalla-habibi-premium-apk
          path: extracted_project/yalla_habibi_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
